<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>GlimTech - Soluções Elétricas & Climatização (Ipatinga)</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #0d1117; color: #f0f6fc; }
    
    header { background: linear-gradient(135deg, #090d16 0%, #161b22 100%); border-bottom: 2px solid #007bff; padding: 25px 20px; text-align: center; }
    header h1 { margin: 0; color: #fff; font-size: 26px; }
    header p { color: #8b949e; margin: 5px 0 15px 0; font-size: 14px; }
    
    .caixa-busca { position: relative; display: inline-block; width: 100%; max-width: 450px; }
    #busca { width: 100%; padding: 12px 15px; font-size: 16px; border: 1px solid #30363d; border-radius: 6px; background-color: #161b22; color: #fff; outline: none; box-sizing: border-box; }
    #busca:focus { border-color: #007bff; }

    .container-principal { display: flex; gap: 30px; padding: 30px; max-width: 1200px; margin: 0 auto; flex-wrap: wrap; justify-content: center; }
    .catalogo { flex: 1; display: flex; gap: 20px; flex-wrap: wrap; align-content: flex-start; justify-content: center; }
    
    .item { background: #161b22; border: 1px solid #30363d; padding: 20px; border-radius: 10px; width: 190px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; }
    .item:hover { transform: translateY(-3px); border-color: #58a6ff; }
    
    .item img { width: 100px; height: 100px; object-fit: contain; margin: 0 auto 15px auto; background: #fff; padding: 5px; border-radius: 6px; }
    .item span.cat { font-size: 11px; color: #58a6ff; text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 5px; }
    .item h4 { font-size: 15px; margin: 0 0 10px 0; color: #c9d1d9; }
    .item p { font-weight: bold; color: #3fb950; margin: 0 0 15px 0; font-size: 16px; }
    
    .item button { cursor: pointer; padding: 10px; border: none; border-radius: 6px; background: #238636; color: white; width: 100%; font-weight: bold; font-size: 14px; transition: background 0.2s; }
    .item button:hover { background: #2ea043; }

    .carrinho { background: #161b22; border: 2px solid #238636; padding: 20px; border-radius: 10px; width: 300px; height: fit-content; box-shadow: 0 4px 10px rgba(0,0,0,0.3); position: sticky; top: 20px; }
    .carrinho h3 { margin-top: 0; color: #c9d1d9; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
    
    ul#lista-carrinho { padding-left: 20px; max-height: 220px; overflow-y: auto; color: #8b949e; }
    ul#lista-carrinho li { font-size: 14px; margin-bottom: 8px; }
    
    .total-txt { font-size: 16px; color: #f0f6fc; margin: 15px 0; }
    
    .btn-zap { cursor: pointer; background: #238636; color: white; border: none; border-radius: 6px; width: 100%; padding: 12px; font-size: 16px; font-weight: bold; transition: background 0.2s; }
    .btn-zap:hover { background: #2ea043; }
  </style>
</head>
<body>

  <header>
    <h1>⚡ GlimTech - Soluções Elétricas & Climatização</h1>
    <p>Catálogo Completo - Ipatinga / MG</p>
    
    <div class="caixa-busca">
      <input type="text" id="busca" list="opcoes-componentes" oninput="filtrarProdutos()" placeholder="🔍 Selecione ou pesquise um componente...">
      <datalist id="opcoes-componentes"></datalist>
    </div>
  </header>

  <div class="container-principal">
    <div class="catalogo" id="produtos-loja">
      <p style="color: #8b949e;">Carregando catálogo...</p>
    </div>

    <div class="carrinho">
      <h3>🛒 Seu Pedido</h3>
      <ul id="lista-carrinho">
        <li style="list-style: none; margin-left: -20px;">Nenhum item adicionado.</li>
      </ul>
      <div class="total-txt"><strong>Total: R$ <span id="total">0.00</span></strong></div>
      <button class="btn-zap" onclick="enviarWhatsApp()">Enviar Pedido no WhatsApp</button>
    </div>
  </div>

  <script>
    let produtosDB = [];
    let carrinho = [];
    let total = 0;

    fetch('produtos.json')
      .then(response => response.json())
      .then(data => {
        produtosDB = data;
        renderizarProdutos(produtosDB);
        popularListaSuspensa(produtosDB);
      })
      .catch(error => {
        console.error("Erro ao carregar produtos:", error);
        document.getElementById('produtos-loja').innerHTML = '<p style="color: #f85149;">Erro ao carregar o catálogo. Verifique se o arquivo produtos.json está na mesma pasta.</p>';
      });

    function popularListaSuspensa(lista) {
      const datalist = document.getElementById('opcoes-componentes');
      datalist.innerHTML = '';
      lista.forEach(prod => {
        let option = document.createElement('option');
        option.value = prod.nome;
        datalist.appendChild(option);
      });
    }

    function renderizarProdutos(lista) {
      const container = document.getElementById('produtos-loja');
      container.innerHTML = '';
      
      if (lista.length === 0) {
        container.innerHTML = '<p style="color: #8b949e;">Nenhum produto encontrado.</p>';
        return;
      }

      lista.forEach(prod => {
        container.innerHTML += `
          <div class="item">
            <div>
              <span class="cat">${prod.categoria}</span>
              <img src="${prod.imagem}" alt="${prod.nome}" onerror="this.src='https://via.placeholder.com/100?text=GlimTech'">
              <h4>${prod.nome}</h4>
              <p>R$ ${prod.preco.toFixed(2)}</p>
            </div>
            <button onclick="adicionar('${prod.nome}', ${prod.preco})">+ Adicionar</button>
          </div>
        `;
      });
    }

    function adicionar(nome, preco) {
      carrinho.push({ nome, preco });
      total += preco;
      atualizarCarrinho();

      // Limpa a barra de busca e restaura o catálogo completo automaticamente ao adicionar
      document.getElementById('busca').value = '';
      renderizarProdutos(produtosDB);
    }

    function atualizarCarrinho() {
      const lista = document.getElementById('lista-carrinho');
      lista.innerHTML = '';
      
      if (carrinho.length === 0) {
        lista.innerHTML = '<li style="list-style: none; margin-left: -20px;">Nenhum item adicionado.</li>';
      } else {
        carrinho.forEach(item => {
          let li = document.createElement('li');
          li.textContent = `${item.nome} - R$ ${item.preco.toFixed(2)}`;
          lista.appendChild(li);
        });
      }
      document.getElementById('total').textContent = total.toFixed(2);
    }

    function filtrarProdutos() {
      let termoDigitado = document.getElementById('busca').value.toLowerCase().trim();
      let palavras = termoDigitado.split(/\s+/);

      let filtrados = produtosDB.filter(p => {
        let textoProduto = (p.nome + " " + p.categoria).toLowerCase();
        return palavras.every(palavra => textoProduto.includes(palavra));
      });

      renderizarProdutos(filtrados);
    }

    function enviarWhatsApp() {
      if (carrinho.length === 0) return alert('Adicione itens ao pedido primeiro!');
      
      let texto = "Olá! Gostaria de fazer o seguinte pedido na GlimTech (Ipatinga):\n\n";
      carrinho.forEach(item => {
        texto += `- ${item.nome} (R$ ${item.preco.toFixed(2)})\n`;
      });
      texto += `\n*Total: R$ ${total.toFixed(2)}*`;

      let telefone = "5531982993352";
      let url = `https://wa.me/${telefone}?text=${encodeURIComponent(texto)}`;
      window.open(url, '_blank');
    }
  </script>

</body>
</html>
